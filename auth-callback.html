<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Returning to Dabblebit…</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF8E7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#3B332C;padding:24px}
  main{text-align:center;max-width:420px}
  h1{font-size:28px;line-height:1.2;margin:0 0 12px}
  p{font-size:17px;line-height:1.5;color:#6B5F55;margin:0 0 24px}
  a.button{display:inline-block;background:#2F9E44;color:#fff;font-weight:700;font-size:18px;text-decoration:none;padding:15px 32px;border-radius:999px}
  a.button:active{background:#27853A}
  .fine{font-size:14px;margin-top:28px}
</style>
</head>
<body>
  <main>
    <h1 id="heading">You&rsquo;re signed in.</h1>
    <p id="message">Returning you to Dabblebit&hellip;</p>
    <p><a class="button" id="openApp" href="#">Open Dabblebit</a></p>
    <p class="fine">If the app doesn&rsquo;t open on its own, tap the button above.</p>
  </main>
<script>
(function(){
  var scheme='com.clevercrump.dabblebit://auth-callback';
  var q=window.location.search||'';
  var h=window.location.hash||'';
  var link=document.getElementById('openApp');
  if(!q && !h){
    document.getElementById('heading').textContent='Dabblebit sign-in';
    document.getElementById('message').textContent='This page completes sign-in for the Dabblebit app. If you opened it by mistake, head back to the site.';
    link.textContent='Back to dabblebit.com';
    link.href='https://dabblebit.com/';
    return;
  }
  var target=scheme+q+h;
  link.href=target;
  try{ window.location.replace(target); }catch(e){ window.location.href=target; }
  setTimeout(function(){ window.location.href=target; },1200);
})();
</script>
</body>
</html>
